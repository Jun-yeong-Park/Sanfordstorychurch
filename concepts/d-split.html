<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/favicon/favicon-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="_hero.css">
<title>스토리교회 — 안 D: SPLIT</title>
<style>
body{background:var(--navy);color:var(--cream)}
.split{min-height:100svh;display:grid;grid-template-rows:38svh auto}
.pane-img{order:-1}
.pane-img{position:relative;overflow:hidden}
.pane-img img{width:100%;height:100%;object-fit:cover;object-position:center 40%;
  filter:saturate(.78) contrast(1.06);transform:scale(1.04)}
.pane-img::after{content:"";position:absolute;inset:0;background:rgba(15,30,52,.34)}
.pane-txt{display:flex;flex-direction:column;justify-content:space-between;padding:var(--pad);gap:var(--s3)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.mast a{display:flex;align-items:center;gap:9px;text-decoration:none}
.mast img{width:26px}
.mast b{font-family:var(--display);font-size:19px;letter-spacing:.05em;font-weight:400}
.mast b i{font-style:normal;color:var(--orange)}
.clock{display:flex;align-items:center;gap:8px;color:var(--cream-dim)}
.clock .dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}
h1{font-family:var(--kr);font-weight:800;font-size:clamp(2.1rem,7.2vw,4.4rem);line-height:1.14;
  letter-spacing:-.048em;margin:0}
h1 em{font-style:normal;color:var(--orange);white-space:nowrap}
.sub{font-family:var(--kr);font-size:16px;line-height:1.9;color:var(--cream-dim);max-width:34ch;margin:var(--s3) 0 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:var(--s3)}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;padding-top:var(--s2);border-top:1px solid var(--hair);color:var(--cream-dim)}
.meta b{color:var(--cream)}
/* the seam: a live rail between the two panes */
.seam{display:none}
@media(min-width:900px){
  .split{grid-template-rows:none;grid-template-columns:1fr 34px 1fr}
  .pane-img{order:0}
  .pane-txt{padding:var(--pad) 0 var(--pad) var(--pad);order:-1}
  .seam{display:flex;align-items:center;justify-content:center;border-inline:1px solid var(--hair)}
  .seam span{writing-mode:vertical-rl;font-size:10px;font-weight:700;letter-spacing:.38em;
    text-transform:uppercase;color:var(--cream-dim);white-space:nowrap}
  .seam .tick{position:absolute;width:1px;height:64px;background:var(--orange);animation:run 6.5s ease-in-out infinite}
  .seam{position:relative}
  @keyframes run{0%{top:6%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:calc(94% - 64px);opacity:0}}
}
@media(prefers-reduced-motion:reduce){.seam .tick{animation:none;top:8%}}
</style>
</head>
<body>
<div class="split">
  <div class="pane-txt">
    <div class="mast">
      <a href="#"><img src="../assets/emblem/icon-orange-tp.png" alt=""><b>STORY<i>.</i>CHURCH</b></a>
      <span class="clock label"><span class="dot"></span><span id="clock">–</span> EST</span>
    </div>
    <div>
      <p class="label" style="color:var(--orange);margin:0 0 var(--s3)">Sanford, Florida <span class="kr" style="color:var(--cream-dim)">· 한인 개척교회</span></p>
      <h1 class="kr">하나님의 이야기가<br><em>당신의 삶</em>에서<br>시작됩니다.</h1>
      <p class="sub">주일 저녁 6시. 편한 옷으로 오셔서 함께 예배하고, 예배가 끝나면 한 상에 둘러앉습니다.</p>
      <div class="acts">
        <a class="btn btn-orange" href="#">처음 오시나요? →</a>
        <a class="btn btn-ghost-light" href="#">교회 소개</a>
      </div>
    </div>
    <div class="meta label">
      <span><b>Sunday 6PM</b></span><span>Seminole County</span>
      <span>Member of CRCNA</span><span class="mono" id="dday">D–23</span>
    </div>
  </div>
  <div class="seam" aria-hidden="true"><span>First Gathering · 2026.09.27</span><i class="tick"></i></div>
  <div class="pane-img"><img src="../assets/photos/sanford-clock.webp" alt="플로리다 샌포드 다운타운"></div>
</div>
<a class="study" href="index.html"><b>D</b> SPLIT — 히어로 시안 · 목록으로</a>
<script>
(function(){
  var T=new Date('2026-09-27T18:00:00-04:00').getTime();
  function up(){
    var l=T-Date.now();
    document.getElementById('dday').textContent = l<=0?'TODAY':'D–'+Math.floor(l/864e5);
    document.getElementById('clock').textContent = new Intl.DateTimeFormat('en-US',
      {timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
  }
  up(); setInterval(up,20000);
})();
</script>
</body>
</html>
