<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Sanford Story Church — 말씀 노트 (낱장)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --orange:#FF9A1F; --navy:#0F1E34; --gray:#D7D9DD; --ink:#0F1E34; --ink-dim:rgba(15,30,52,.62); --rule:rgba(15,30,52,.22);
    --display:"Bebas Neue",sans-serif; --en:"Montserrat",sans-serif; --ko:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif; --line:7.4mm; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#e9e6df; font-family:var(--ko); color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #bar { position:sticky; top:0; z-index:9; display:flex; gap:10px; align-items:center; padding:10px 16px; background:var(--navy); color:#F4F0E6; font:600 12px/1 var(--en); letter-spacing:.12em; }
  #bar b { font-family:var(--display); font-size:20px; letter-spacing:.04em; font-weight:400; margin-right:auto; }
  #bar a { color:#F4F0E6; text-decoration:none; padding:8px 12px; border:1px solid #F4F0E6; border-radius:4px; font-size:11px; }
  #bar a.on { background:var(--orange); border-color:var(--orange); color:var(--navy); }
  #bar button { font:700 11px/1 var(--en); letter-spacing:.1em; text-transform:uppercase; padding:9px 14px; border:1px solid var(--orange); background:var(--orange); color:var(--navy); border-radius:4px; cursor:pointer; }
  #wrap { display:flex; justify-content:center; padding:28px 16px 60px; }
  .page { width:148.5mm; height:210mm; padding:11mm 10mm 12mm; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.18); display:flex; flex-direction:column; position:relative; overflow:hidden; }

  .h-sec { display:flex; align-items:baseline; gap:3mm; }
  .h-sec .display { font-family:var(--display); font-size:22pt; line-height:.92; }
  .h-sec .ko { font-weight:700; font-size:10pt; color:var(--ink-dim); }
  .meta { display:grid; grid-template-columns:1fr auto; gap:1mm 4mm; border-bottom:1.2mm solid var(--navy); padding-bottom:2.6mm; margin-top:2.5mm; }
  .meta .t { grid-column:1/-1; font-size:12.5pt; font-weight:700; line-height:1.3; word-break:keep-all; }
  .meta .s { font-size:8.2pt; color:var(--ink-dim); font-weight:500; }
  .meta .p { font-size:8.2pt; font-weight:600; }
  .sh { display:flex; align-items:baseline; gap:1.8mm; }
  .sh .n { font-family:var(--display); font-size:12pt; color:var(--orange); line-height:1; }
  .sh .nm { font-family:var(--display); font-size:12pt; letter-spacing:.03em; line-height:1; }
  .sh .ko { font-size:7.3pt; font-weight:700; color:var(--ink-dim); }
  .sh .tag { margin-left:auto; font:600 6pt/1 var(--en); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); }
  .q { font-size:7pt; line-height:1.4; color:var(--ink-dim); font-weight:500; margin:.6mm 0 .4mm; }
  .lines { background:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - .3mm), var(--rule) calc(var(--line) - .3mm), var(--rule) var(--line)); }
  .foot { position:absolute; bottom:5.5mm; left:10mm; right:10mm; display:flex; justify-content:space-between; font:600 6.5pt/1 var(--en); letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; }

  /* v1: 세로 4단 줄노트 */
  .v1 .sec { margin-top:3mm; }
  .v1 .sec .q { margin:.8mm 0 .3mm; }
  .v1 .lines { height:calc(var(--line) * var(--n)); }
  .v1 .foot { bottom:6mm; }

  /* v4: 흐름형 + 기도 카드 절취 */
  .v4 { padding-bottom:0; }
  .v4 .flow { flex:1; min-height:0; margin:2.6mm 0 4.5mm; display:grid; grid-template-columns:5mm 1fr; grid-template-rows:1.5fr 1fr 1fr; column-gap:2.4mm; position:relative; }
  .v4 .flow::before { content:""; position:absolute; left:2.3mm; top:3mm; bottom:3mm; border-left:.3mm dashed var(--rule); }
  .v4 .step { display:contents; }
  .v4 .step i { width:4.6mm; height:4.6mm; border-radius:50%; background:#fff; border:.35mm solid var(--orange); font:400 7.5pt/4.2mm var(--display); text-align:center; color:var(--orange); font-style:normal; position:relative; }
  .v4 .step > div { display:flex; flex-direction:column; padding-bottom:2.4mm; min-height:0; }
  .v4 .box { border:.3mm solid var(--gray); flex:1; }
  .v4 .tear { flex:none; margin:0 -10mm; height:32mm; padding:4mm 10mm 0; border-top:.4mm dashed var(--navy); position:relative; }
  .v4 .tear::before { content:"✂ 절취선 · 기도 카드는 팰릿 월에 꽂거나 스태프에게 주세요"; position:absolute; top:.6mm; left:10mm; font-size:5.8pt; font-weight:600; color:var(--ink-dim); }
  .v4 .tear .hd { display:flex; justify-content:space-between; align-items:baseline; margin-top:1.2mm; }
  .v4 .tear .hd b { font-family:var(--display); font-size:12pt; letter-spacing:.03em; font-weight:400; }
  .v4 .tear .hd small { font-size:6.6pt; color:var(--ink-dim); font-weight:500; }
  .v4 .tear .st { margin-top:1.4mm; font-size:8pt; font-weight:600; line-height:1.5; }
  .v4 .tear .lines { --line:6.4mm; height:calc(var(--line) * 2); margin-top:1.2mm; }
  .v4 .tear .nm { margin-top:1.2mm; font-size:6.8pt; color:var(--ink-dim); display:flex; gap:2mm; align-items:flex-end; }
  .v4 .tear .nm span { flex:1; border-bottom:.3mm solid var(--navy); height:4.8mm; }
  .v4 .tear .nm span.d { flex:.5; }

  @page { size: A5 portrait; margin: 0; }
  @media print { html, body { background:#fff; } #bar { display:none; } #wrap { padding:0; } .page { box-shadow:none; } }
</style>
</head>
<body>
<div id="bar">
  <b>SERMON NOTE · 낱장</b>
  <a href="?v=1" id="l1">안 1 · 세로 4단</a>
  <a href="?v=4" id="l4">안 4 · 흐름 + 기도 카드</a>
  <button onclick="window.print()">Print (A5)</button>
</div>
<div id="wrap"></div>

<script src="data.js"></script>
<script>
  const D = window.BULLETIN;
  const v = new URLSearchParams(location.search).get("v") === "1" ? 1 : 4;
  document.getElementById("l" + v).className = "on";

  const head = `<div class="h-sec"><span class="display">SERMON NOTE</span><span class="ko">말씀 노트</span></div>
    <div class="meta"><div class="t">${D.sermon.title}</div><div class="s">${D.sermon.scripture} · ${D.sermon.scriptureEn}</div><div class="p">${D.sermon.preacher}</div></div>`;
  const foot = `<div class="foot"><span>Sanford Story Church</span><span>${D.issue.dateEn}</span></div>`;

  const v1 = () => {
    const sec = (n, nm, ko, tag, q, lines) => `<div class="sec">
      <div class="sh"><span class="n">0${n}</span><span class="nm">${nm}</span><span class="ko">${ko}</span><span class="tag">${tag}</span></div>
      <div class="q">${q}</div><div class="lines" style="--n:${lines}"></div></div>`;
    return `<section class="page v1">${head}
      ${sec(1, "HIS STORY", "하나님의 이야기", "설교 중", "오늘 말씀에서 발견한 하나님 · 마음에 남는 구절과 문장", 7)}
      ${sec(2, "MY STORY", "나의 이야기", "묵상", "이 말씀 앞에서 내 삶은 어떤가요? 하나님이 나에게 하시는 말씀", 3)}
      ${sec(3, "DEEP STORY", "깊어진 이야기", "결단", "이번 주 실천할 한 가지 — 언제 · 어디서 · 무엇을", 2)}
      ${sec(4, "OUR STORY", "우리의 이야기", "테이블", "함께 나눈 은혜 · 기도해 줄 사람과 제목", 4)}
      ${foot}</section>`;
  };

  const v4 = () => {
    const step = (n, nm, ko, tag, q) => `<div class="step"><i>${n}</i><div>
      <div class="sh"><span class="nm">${nm}</span><span class="ko">${ko}</span><span class="tag">${tag}</span></div>
      <div class="q">${q}</div><div class="box"></div></div></div>`;
    return `<section class="page v4">${head}
      <div class="flow">
        ${step(1, "HIS STORY", "하나님의 이야기", "설교 중", "오늘 말씀에서 발견한 하나님 · 마음에 남는 구절")}
        ${step(2, "MY STORY", "나의 이야기", "묵상 · 나눔", "이 말씀이 내 삶에 던지는 질문과 나의 답")}
        ${step(3, "DEEP STORY", "깊어진 이야기", "결단", "내려놓을 것 · 붙들 것 · 하나님께 드리는 나의 결단")}
      </div>
      <div class="tear">
        <div class="hd"><b>PRAYER CARD</b><small>기도 제목 · 함께 기도해 주세요 · ${D.issue.dateEn}</small></div>
        <div class="lines"></div>
        <div class="nm">이름(선택)<span></span>연락처(선택)<span class="d"></span></div>
      </div></section>`;
  };

  document.getElementById("wrap").innerHTML = v === 1 ? v1() : v4();
</script>
</body>
</html>
