<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Sanford Story Church — 주보</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* ---------- Brand tokens (docs/brand-guide.md) ---------- */
  :root {
    --orange: #FF9A1F;
    --navy: #0F1E34;
    --cream: #F4F0E6;
    --gray: #D7D9DD;
    --ink: #0F1E34;
    --ink-dim: rgba(15,30,52,.62);
    --display: "Bebas Neue", sans-serif;
    --en: "Montserrat", sans-serif;
    --ko: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --line: 7.6mm;               /* 설교노트 줄 간격 */
    --tear: 32mm;                /* P3 절취 카드 높이 = P4 하단 카드 뒷면 높이 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9e6df; font-family: var(--ko); color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* ---------- Screen toolbar ---------- */
  #bar { position: sticky; top: 0; z-index: 9; display: flex; gap: 10px; align-items: center;
    padding: 10px 16px; background: var(--navy); color: var(--cream); font: 600 12px/1 var(--en); letter-spacing: .12em; }
  #bar b { font-family: var(--display); font-size: 20px; letter-spacing: .04em; font-weight: 400; margin-right: auto; }
  #bar button { font: 700 11px/1 var(--en); letter-spacing: .1em; text-transform: uppercase; padding: 9px 14px;
    border: 1px solid var(--cream); background: transparent; color: var(--cream); border-radius: 4px; cursor: pointer; }
  #bar button.primary { background: var(--orange); border-color: var(--orange); color: var(--navy); }
  #bar span { font-family: var(--ko); font-weight: 500; letter-spacing: 0; opacity: .8; }

  /* ---------- Sheets / pages ---------- */
  #sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 28px 16px 60px; }
  .sheet { width: 297mm; height: 210mm; display: flex; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.18); position: relative; }
  .sheet::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed rgba(15,30,52,.25); pointer-events: none; }
  .sheet-label { position: absolute; top: -18px; left: 0; font: 600 10px/1 var(--en); letter-spacing: .18em; color: var(--ink-dim); text-transform: uppercase; }
  .page { width: 148.5mm; height: 210mm; padding: 11mm 10mm; background: #fff; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .page.navy { background: #fff; color: var(--navy); }
  .page.white { background: #fff; }
  .pn { position: absolute; bottom: 5.5mm; font: 600 7.5pt/1 var(--en); letter-spacing: .18em; color: var(--ink-dim); }
  .pn.l { left: 10mm; } .pn.r { right: 10mm; }
  .page.navy .pn { color: var(--ink-dim); }

  /* ---------- Type helpers ---------- */
  .eyebrow { font: 600 7.5pt/1 var(--en); letter-spacing: .2em; text-transform: uppercase; color: var(--orange); }
  .display { font-family: var(--display); line-height: .92; letter-spacing: .01em; }
  .h-sec { display: flex; align-items: baseline; gap: 3mm; margin-bottom: 3mm; }
  .h-sec .display { font-size: 22pt; }
  .h-sec .ko { font-weight: 700; font-size: 10pt; color: var(--ink-dim); }
  hr.orange { border: 0; border-top: 1.2mm solid var(--orange); width: 12mm; margin: 2.5mm 0 4mm; }
  small.dim { color: var(--ink-dim); }

  /* ---------- P1 Cover ---------- */
  .cover { padding: 12mm 11mm 11mm; }
  .cover .top { display: flex; justify-content: space-between; font: 600 7.5pt/1 var(--en); letter-spacing: .2em; color: var(--orange); }
  .cover .logo { width: 92mm; margin: 22mm auto 0; display: block; }
  .cover .slogan { margin-top: 20mm; font-family: var(--display); font-size: 34pt; line-height: .9; color: var(--navy); }
  .cover .slogan em { font-style: normal; color: var(--orange); }
  .cover .slogan-ko { margin-top: 3.5mm; font-size: 9.5pt; font-weight: 500; color: var(--ink-dim); letter-spacing: .02em; }
  .cover .date { margin-top: auto; border-top: 1px solid var(--gray); padding-top: 4.5mm; display: flex; justify-content: space-between; align-items: flex-end; }
  .cover .date .big { font-family: var(--display); font-size: 26pt; line-height: 1; color: var(--navy); }
  .cover .date .ko { font-size: 8.5pt; font-weight: 500; color: var(--ink-dim); margin-top: 1.5mm; }
  .cover .date .svc { text-align: right; font: 600 8pt/1.6 var(--en); letter-spacing: .12em; color: var(--orange); text-transform: uppercase; }
  .cover .date .svc small { display: block; font-family: var(--ko); font-weight: 500; letter-spacing: 0; color: var(--ink-dim); text-transform: none; }
  .cover .sermon { margin-top: 4.5mm; border-left: 1.2mm solid var(--orange); padding: 1.5mm 4mm; }
  .cover .sermon .t { font-size: 12pt; font-weight: 700; line-height: 1.3; color: var(--navy); }
  .cover .sermon .s { margin-top: 1.5mm; font-size: 8.5pt; color: var(--ink-dim); }
  .cover .foot { margin-top: 4.5mm; display: flex; justify-content: space-between; font: 500 7pt/1.5 var(--en); color: var(--ink-dim); letter-spacing: .04em; }

  /* ---------- P2 Order of worship ---------- */
  .order .parts { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; padding: 1mm 0 3mm; }
  .order .part { margin-top: 2mm; }
  .order .part-h { display: flex; align-items: baseline; gap: 2.5mm; border-bottom: 1px solid var(--navy); padding-bottom: 1.2mm; margin-bottom: 1.6mm; }
  .order .part-h .tag { font-family: var(--display); font-size: 15pt; color: var(--orange); }
  .order .part-h .nm { font-family: var(--display); font-size: 15pt; letter-spacing: .03em; }
  .order .part-h .sub { margin-left: auto; font-size: 7pt; color: var(--ink-dim); font-weight: 500; }
  .order table { width: 100%; border-collapse: collapse; }
  .order td { padding: 1.6mm 0; vertical-align: top; font-size: 8.8pt; line-height: 1.35; border-bottom: .3mm dotted rgba(15,30,52,.18); }
  .order td.n { width: 24mm; font-weight: 700; }
  .order td.d { color: var(--ink-dim); }
  .order td.b { width: 21mm; text-align: right; font-weight: 500; white-space: nowrap; }
  .order .verse { margin-top: auto; border: .45mm solid var(--navy); padding: 3.6mm 4.2mm; }
  .order .verse .eyebrow { margin-bottom: 1.6mm; }
  .order .verse p { font-size: 8.2pt; line-height: 1.55; word-break: keep-all; }
  .order .verse .ref { text-align: right; font: 600 7pt/1 var(--en); letter-spacing: .1em; margin-top: 1.8mm; color: var(--orange); }

  /* ---------- P3 Sermon notes (흐름형 + 기도 카드 절취) ---------- */
  .notes { padding: 11mm 10mm 0; }
  .notes .meta { display: grid; grid-template-columns: 1fr auto; gap: 1mm 4mm; border-bottom: 1.2mm solid var(--navy); padding-bottom: 2.6mm; }
  .notes .meta .t { grid-column: 1 / -1; font-size: 12.5pt; font-weight: 700; line-height: 1.3; word-break: keep-all; }
  .notes .meta .s { font-size: 8.2pt; color: var(--ink-dim); font-weight: 500; }
  .notes .meta .p { font-size: 8.2pt; font-weight: 600; }
  .notes .flow { flex: 1; min-height: 0; margin: 2.6mm 0 4.5mm; display: grid; grid-template-columns: 5mm 1fr; grid-template-rows: 1.5fr 1fr 1fr; column-gap: 2.4mm; position: relative; }
  .notes .flow::before { content: ""; position: absolute; left: 2.3mm; top: 3mm; bottom: 3mm; border-left: .3mm dashed rgba(15,30,52,.22); }
  .notes .step { display: contents; }
  .notes .step i { width: 4.6mm; height: 4.6mm; border-radius: 50%; background: #fff; border: .35mm solid var(--orange); font: 400 7.5pt/4.2mm var(--display); text-align: center; color: var(--orange); font-style: normal; position: relative; }
  .notes .step > div { display: flex; flex-direction: column; padding-bottom: 2.4mm; min-height: 0; }
  .notes .sh { display: flex; align-items: baseline; gap: 1.8mm; }
  .notes .sh .nm { font-family: var(--display); font-size: 12pt; letter-spacing: .03em; line-height: 1; }
  .notes .sh .ko { font-size: 7.3pt; font-weight: 700; color: var(--ink-dim); }
  .notes .sh .tag { margin-left: auto; font: 600 6pt/1 var(--en); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  .notes .q { font-size: 7pt; line-height: 1.4; color: var(--ink-dim); font-weight: 500; margin: .6mm 0 .4mm; }
  .notes .box { border: .3mm solid var(--gray); flex: 1; }
  .notes .tear { flex: none; margin: 0 -10mm; height: var(--tear); padding: 4mm 10mm 0; border-top: .4mm dashed var(--navy); position: relative; }
  .notes .tear::before { content: "✂ 절취선 · 기도 카드는 팰릿 월에 꽂거나 스태프에게 주세요"; position: absolute; top: .6mm; left: 10mm; font-size: 5.8pt; font-weight: 600; color: var(--ink-dim); }
  .notes .tear .hd { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1.2mm; }
  .notes .tear .hd b { font-family: var(--display); font-size: 12pt; letter-spacing: .03em; font-weight: 400; }
  .notes .tear .hd small { font-size: 6.6pt; color: var(--ink-dim); font-weight: 500; }
  .notes .tear .st { margin-top: .8mm; font-size: 8pt; font-weight: 600; line-height: 1.4; }
  .notes .tear .lines { height: calc(6.4mm * 2); margin-top: 1.2mm;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 6.1mm, rgba(15,30,52,.22) 6.1mm, rgba(15,30,52,.22) 6.4mm); }
  .notes .tear .nm { margin-top: 1.2mm; font-size: 6.8pt; color: var(--ink-dim); display: flex; gap: 2mm; align-items: flex-end; }
  .notes .tear .nm span { flex: 1; border-bottom: .3mm solid var(--navy); height: 4.8mm; }
  .notes .tear .nm span.d { flex: .5; }

  /* ---------- P4 News ---------- */
  .news .list { margin-top: 1mm; }
  .news .item { display: grid; grid-template-columns: 4.5mm 1fr; gap: 2mm; padding: 1mm 0; border-bottom: .3mm dotted rgba(15,30,52,.18); font-size: 8pt; line-height: 1.4; word-break: keep-all; }
  .news .item i { font: 400 11pt/1 var(--display); color: var(--orange); }
  .news .item b { display: block; font-weight: 700; margin-bottom: .3mm; }
  .news .two { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; margin-top: 2.4mm; }
  .news h4 { font: 600 7.5pt/1 var(--en); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); margin-bottom: 1.4mm; }
  .news .grp { font-size: 7.8pt; line-height: 1.4; padding: 1mm 0; border-top: .3mm solid rgba(15,30,52,.15); }
  .news .grp b { font-weight: 700; }
  .news .grp span { display: block; color: var(--ink-dim); }
  .news .kv { font-size: 7.8pt; line-height: 1.5; }
  .news .kv div { display: flex; gap: 2mm; padding: .45mm 0; border-top: .3mm solid rgba(15,30,52,.15); }
  .news .kv div span:first-child { color: var(--ink-dim); width: 29mm; flex: none; }
  .news .kv div span:last-child { font-weight: 600; }
  .news .off { margin-top: 2.2mm; }
  .news .off .row { display: grid; grid-template-columns: repeat(5, 1fr); border-top: .3mm solid rgba(15,30,52,.15); border-bottom: .3mm solid rgba(15,30,52,.15); }
  .news .off .c { padding: 1.4mm 0 1.4mm 2mm; border-left: .3mm solid rgba(15,30,52,.15); }
  .news .off .c:first-child { border-left: 0; padding-left: 0; }
  .news .off .c small { display: block; font-size: 6.4pt; color: var(--ink-dim); line-height: 1.3; }
  .news .off .c b { display: block; font: 600 9pt/1.3 var(--en); margin-top: .4mm; }
  .news .off .c.total { border-left: .45mm solid var(--navy); }
  .news .off .c.total b { color: var(--orange); }
  .news .off .note { font-size: 6.4pt; color: var(--ink-dim); margin-top: 1mm; line-height: 1.4; }
  .news ul.pr { list-style: none; font-size: 7.8pt; line-height: 1.45; }
  .news ul.pr li { padding: .6mm 0 .6mm 3.2mm; border-top: .3mm solid rgba(15,30,52,.15); position: relative; word-break: keep-all; }
  .news ul.pr li::before { content: ""; position: absolute; left: 0; top: 2.6mm; width: 1.6mm; height: 1.6mm; background: var(--orange); }
  .news .foot { flex: none; margin: auto -10mm 0; height: var(--tear); padding: 2mm 10mm 0; border-top: .4mm dashed var(--navy); display: flex; gap: 4mm; align-items: center; position: relative; }
  .news .foot::before { content: "기도 카드 뒷면 · Prayer Card"; position: absolute; top: .6mm; right: 10mm; font-size: 5.8pt; font-weight: 600; color: var(--ink-dim); }
  .news .foot img { height: 10mm; }
  .news .foot .info { font-size: 7pt; line-height: 1.55; color: var(--ink-dim); }
  .news .foot .info b { color: var(--navy); font-weight: 700; font-size: 7.6pt; }
  .news .foot .info em { font-style: normal; color: var(--orange); font-weight: 600; }
  .news .foot .crc { margin-left: auto; text-align: right; font: 600 6.3pt/1.5 var(--en); letter-spacing: .08em; color: var(--ink-dim); }
  .news .foot .crc img { height: 7mm; display: block; margin: 0 0 1mm auto; opacity: .85; }

  /* ---------- Print ---------- */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff; }
    #bar { display: none; }
    #sheets { padding: 0; gap: 0; display: block; }
    .sheet { box-shadow: none; page-break-after: always; break-after: page; }
    .sheet::after, .sheet-label { display: none; }
  }
</style>
</head>
<body>

<div id="bar">
  <b>SANFORD STORY CHURCH · 주보</b>
  <span id="issue"></span>
  <button id="toggle" onclick="toggleView()">읽기 순서 보기</button>
  <button class="primary" onclick="printImposed()">PDF / 인쇄</button>
</div>

<div id="sheets"></div>

<script src="data.js"></script>
<script>
const D = window.BULLETIN;
const esc = s => s ?? "";

// ---------------- P1 표지 ----------------
function pageCover() {
  return `<section class="page navy cover">
    <div class="top"><span>${D.issue.label}</span><span>${D.issue.volume}</span></div>
    <img class="logo" src="assets/logo-navy.svg" alt="Sanford Story Church">
    <div class="slogan">GOD'S STORY<br>BEGINS IN<br><em>YOUR LIFE.</em></div>
    <div class="slogan-ko">${D.church.taglineKo}</div>
    <div class="date">
      <div><div class="big">${D.issue.dateEn}</div><div class="ko">${D.issue.date}</div></div>
      <div class="svc">Sunday Worship<small>${D.issue.service}</small></div>
    </div>
    <div class="sermon">
      <div class="t">${D.sermon.title}</div>
      <div class="s">${D.sermon.scripture} · ${D.sermon.preacher}</div>
    </div>
    <div class="foot"><span>${D.church.web}</span><span>${D.church.instagram}</span></div>
  </section>`;
}

// ---------------- P2 예배 순서 ----------------
function pageOrder() {
  const parts = D.order.map(p => `
    <div class="part">
      <div class="part-h"><span class="tag">${p.tag}</span><span class="nm">${p.name}</span><span class="sub">${p.sub}</span></div>
      <table>${p.items.map(i => `<tr><td class="n">${i.name}</td><td class="d">${esc(i.detail)}</td><td class="b">${esc(i.by)}</td></tr>`).join("")}</table>
    </div>`).join("");
  return `<section class="page order">
    <div class="h-sec"><span class="display">STORY FLOW</span><span class="ko">예배의 흐름</span></div>
    <div class="eyebrow">${D.issue.dateEn} · ${D.issue.service}</div>
    <div class="parts">${parts}</div>
    <div class="verse">
      <div class="eyebrow">Today's Scripture · 오늘의 말씀</div>
      <p>${D.sermon.excerpt}</p>
      <div class="ref">${D.sermon.excerptRef}</div>
    </div>
    <span class="pn r">02</span>
  </section>`;
}

// ---------------- P3 설교 노트 ----------------
// 흐름형: 1 His → 2 My → 3 Deep. 하단은 절취 기도 카드 (뒷면 = P4 하단 교회 정보).
function pageNotes() {
  const step = (n, nm, ko, tag, q) => `<div class="step"><i>${n}</i><div>
      <div class="sh"><span class="nm">${nm}</span><span class="ko">${ko}</span><span class="tag">${tag}</span></div>
      <div class="q">${q}</div><div class="box"></div></div></div>`;
  return `<section class="page white notes">
    <div class="h-sec"><span class="display">SERMON NOTE</span><span class="ko">말씀 노트</span></div>
    <div class="meta">
      <div class="t">${D.sermon.title}</div>
      <div class="s">${D.sermon.scripture} · ${D.sermon.scriptureEn}</div>
      <div class="p">${D.sermon.preacher}</div>
    </div>
    <div class="flow">
      ${step(1, "HIS STORY", "하나님의 이야기", "설교 중", "오늘 말씀에서 발견한 하나님 · 마음에 남는 구절")}
      ${step(2, "MY STORY", "나의 이야기", "묵상 · 나눔", "이 말씀이 내 삶에 던지는 질문과 나의 답")}
      ${step(3, "DEEP STORY", "깊어진 이야기", "결단", "내려놓을 것 · 붙들 것 · 하나님께 드리는 나의 결단")}
    </div>
    <div class="tear">
      <div class="hd"><b>PRAYER CARD</b><small>기도 제목 · 함께 기도해 주세요 · ${D.issue.dateEn}</small></div>
      <div class="lines"></div>
      <div class="nm">이름(선택)<span></span>연락처(선택)<span class="d"></span></div>
    </div>
  </section>`;
}

// ---------------- P4 소식 ----------------
function pageNews() {
  const news = D.news.map((n, i) => `<div class="item"><i>${String(i + 1).padStart(2, "0")}</i><div><b>${n.title}</b>${n.body}</div></div>`).join("");
  const groups = D.groups.map(g => `<div class="grp"><b>${g.name}</b> · ${g.desc}<span>${g.when} · ${g.contact}</span></div>`).join("");
  const kv = (rows) => rows.map(r => `<div><span>${r.role}</span><span>${r.name}</span></div>`).join("");
  const prayers = D.prayers.map(p => `<li>${p}</li>`).join("");
  const money = (n) => "$" + n.toLocaleString("en-US");
  const offering = D.offering.items.map(o => `<div class="c"><small>${o.name}</small><b>${money(o.amount)}</b></div>`).join("")
    + `<div class="c total"><small>합계 Total</small><b>${money(D.offering.items.reduce((a, o) => a + o.amount, 0))}</b></div>`;
  return `<section class="page news">
    <div class="h-sec"><span class="display">STORY NEWS</span><span class="ko">교회 소식</span></div>
    <div class="list">${news}</div>
    <div class="two">
      <div><h4>Small Groups · 모임</h4>${groups}</div>
      <div><h4>Prayer · 기도 제목</h4><ul class="pr">${prayers}</ul></div>
    </div>
    <div class="two">
      <div><h4>Next Week · 다음 주</h4><div class="kv">${kv([
        { role: "날짜", name: D.nextWeek.date },
        { role: "본문", name: D.nextWeek.scripture },
        { role: "제목", name: D.nextWeek.title },
        { role: "섬김", name: D.nextWeek.serving },
      ])}</div></div>
      <div><h4>Serving · 섬기는 분들</h4><div class="kv">${kv([...D.team, ...D.thisWeek])}</div></div>
    </div>
    <div class="off">
      <h4>Offering · 헌금 보고 (${D.offering.week})</h4>
      <div class="row">${offering}</div>
      <div class="note">${D.offering.note}</div>
    </div>
    <div class="foot">
      <img src="assets/emblem.png" alt="">
      <div class="info">
        <b>${D.church.nameKo} ${D.church.nameEn}</b><br>
        ${D.church.address}<br>
        <em>${D.church.web}</em> · ${D.church.instagram}<br>
        ${D.church.email}<br>
        ${D.church.giving}
      </div>
      <div class="crc"><img src="assets/crcna.png" alt="CRCNA">${D.church.legal}</div>
    </div>
  </section>`;
}

// ---------------- 조판 (imposition) ----------------
// 접지 인쇄: 앞면 [P4 | P1], 뒷면 [P2 | P3]  → 짧은 쪽으로 넘김(양면)
const pages = { 1: pageCover, 2: pageOrder, 3: pageNotes, 4: pageNews };
let readingMode = false;

function render() {
  const sheets = readingMode
    ? [["읽기 순서 · 앞", 1, 2], ["읽기 순서 · 뒤", 3, 4]]
    : [["Sheet 1 — 앞면 (P4 · P1)", 4, 1], ["Sheet 1 — 뒷면 (P2 · P3)", 2, 3]];
  document.getElementById("sheets").innerHTML = sheets.map(([label, a, b]) =>
    `<div class="sheet"><span class="sheet-label">${label}</span>${pages[a]()}${pages[b]()}</div>`).join("");
  document.getElementById("issue").textContent = `${D.issue.date} · ${D.issue.volume}`;
  document.getElementById("toggle").textContent = readingMode ? "인쇄 배치 보기" : "읽기 순서 보기";
  document.title = `주보 ${D.issue.date} — Sanford Story Church`;
}
function toggleView() { readingMode = !readingMode; render(); }
function printImposed() { readingMode = false; render(); setTimeout(() => window.print(), 50); }
window.addEventListener("beforeprint", () => { if (readingMode) { readingMode = false; render(); } });
render();
</script>
</body>
</html>
