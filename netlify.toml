# 웹사이트는 web/ 폴더만 배포한다 (앱·주보 소스는 배포 안 함)
[build]
  publish = "web"

# 앱 정책 페이지 짧은 주소
[[redirects]]
  from = "/privacy"
  to = "/app/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/app/terms.html"
  status = 200

# 온라인 주보 QR: 항상 최신 주보. PDF 는 캐시 짧게
[[redirects]]
  from = "/bulletin"
  to = "/bulletin/index.html"
  status = 200
[[headers]]
  for = "/bulletin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 내부 문서(작업 메모 · 브랜드 가이드)는 저장소에만 두고 사이트에서는 404
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
